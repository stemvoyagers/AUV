name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit + golden tests
        run: pytest tests -q

      - name: End-to-end pipeline (truth -> sensors -> ESKF)
        run: python examples/run_pipeline.py

      - name: Validate CSV export contract
        run: python tools/validate_export.py

      - name: Sensor parameter sweep
        run: python examples/run_sweep.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-outputs
          path: |
            outputs/
            exports/
          if-no-files-found: ignore
